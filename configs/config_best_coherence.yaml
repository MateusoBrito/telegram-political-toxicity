model:
  embedding_names:
  - paraphrase-MiniLM-L6-v2
paths:
  input_path: data/processed/stratified_sample_full
  stopwords: data/processed/stopwords.txt
  cache_embeddings_dir: data/cache/embeddings_grid
  dir_reports: reports/topic_modeling/best_coherence_cv
sampling:
  frac: 1.0
grid_search:
  n_neighbors:
  - 30
  n_components:
  - 10
  min_dist:
  - 0.0
  metric:
  - cosine
  min_cluster_size:
  - 1500
  min_samples:
  - 5
  hdbscan_metric:
  - euclidean
  cluster_selection_method:
  - eom
  prediction_data:
  - true
